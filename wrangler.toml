name = "flormorado-cafe-backend-orders"
main = "src/index.ts"
compatibility_date = "2026-09-15"

[observability]
enabled = true

[vars]
ORDERS_EMAIL_FROM = "Flormorado Café <info@flormoradocafe.com>"
# El sitio usa HashRouter, así que todas las rutas viven en este mismo origen.
ALLOWED_ORIGINS = "https://flormoradocafe.com,https://www.flormoradocafe.com"
# Se le muestran a todo cliente que paga por transferencia. Cambiarlas aquí, y
# no en ConfigCat, deja rastro en git de quién las cambió y cuándo.
# PENDIENTE: BREB_HOLDER sigue con valor de prueba; confirmar el titular real
# antes de mezclar FMC-0017.
BREB_KEY = "0090486453"
BREB_HOLDER = "TITULAR DE PRUEBA"

[[d1_databases]]
binding = "DB"
database_name = "flormorado-orders"
database_id = "65bee66d-4b11-4375-8eb9-03f433b58a2e"
migrations_dir = "migrations"

# Los Cron Triggers corren en UTC y Colombia es UTC−5 sin horario de verano,
# así que "cada hora de 8am a 8pm" son las horas 13–23 y 0–1 en UTC. Escrito
# como `0 8-20 * * *` se ejecutaría de 3am a 3pm hora Colombia.
[triggers]
crons = ["0 13-23,0-1 * * *"]

# Límites de tasa (FMC-0021). Cloudflare los cuenta por ubicación y de forma
# eventualmente consistente, así que frenan el abuso pero no son contabilidad
# exacta; por eso el código falla abierto si el binding no responde. Los
# `namespace_id` solo tienen que ser únicos dentro de la cuenta. `period` solo
# admite 10 o 60 segundos.
#
# Las cifras son generosas a propósito: muchos clientes comparten IP (datos
# móviles, oficinas) y un tope apretado bloquearía compras legítimas.

# Pedidos por IP: un cliente real hace uno, quizá dos por reintentos.
[[ratelimits]]
name = "ORDER_IP_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# Pedidos por correo del cliente: evita usar el checkout para llenar de
# confirmaciones el buzón de un tercero, aunque cada petición cambie de IP.
[[ratelimits]]
name = "ORDER_EMAIL_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 3
  period = 60

# Formulario de contacto por IP: cada mensaje envía un correo al negocio.
[[ratelimits]]
name = "CONTACT_IP_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 5
  period = 60

# Panel por IP, antes de verificar la clave: pone techo a la fuerza bruta.
# Una persona usando el panel hace muchas menos de 30 llamadas por minuto.
[[ratelimits]]
name = "ADMIN_IP_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 30
  period = 60
