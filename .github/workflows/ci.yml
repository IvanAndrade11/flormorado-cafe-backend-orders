name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run prettier:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # El despliegue corre aquí y no desde una máquina local a propósito: la red
  # corporativa de la máquina de desarrollo intercepta HTTPS y bloquea la subida
  # del bundle a la API de Cloudflare. Además deja el deploy reproducible.
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Antes del deploy: el código nuevo puede escribir en tablas o columnas que
      # solo existen después de migrar. Si este paso falla, el deploy no corre y
      # producción sigue con el código anterior. Las migraciones ya aplicadas se
      # omiten, así que repetir el paso es seguro.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply flormorado-orders --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
