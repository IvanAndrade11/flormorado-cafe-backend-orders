version: 2
updates:
  # Actualizaciones menores y parches de las dependencias, agrupadas en un solo
  # PR mensual. Dependabot no acumula en un PR abierto: cuando el grupo cambia,
  # cierra el anterior y abre uno nuevo con todo incluido. Con frecuencia
  # semanal eso dejaba un PR cerrado por semana; mensual lo reduce a uno al mes.
  # Las alertas de seguridad de GitHub no dependen de este calendario.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Espera 7 días antes de proponer una versión recién publicada, para que el
    # grupo cambie menos entre corridas. No retrasa las actualizaciones de
    # seguridad.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Los saltos de versión mayor pueden romper el build o el lint y no deben
    # llegar como un PR más de la semana: se prueban a mano, uno por uno, en su
    # propio ticket. Aquí solo entran menores y parches.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ":package:"

  # Las acciones del CI también se actualizan, mayores incluidos: son cambios
  # pequeños, el propio CI los prueba, y quedarse atrás rompe el pipeline
  # cuando GitHub retira una versión de Node.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ":package:"
